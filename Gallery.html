    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px 20px;
            background-color: #f1f1f1;
            font-family: Arial, sans-serif;
        }

        /* Profile Header */
        .profile-header {
            background-color: #000;
            color: white;
            text-align: center;
            padding: 23px 15px 37px;
        }

        .profile-img {
            display: block;
            width: 290px;
            height: 290px;
            object-fit: cover;
            margin: 0 auto 15px;
        }

        .profile-header h1 {
            font-size: 36px;
            font-weight: normal;
            margin: 10px 0 20px;
        }

        /* Navbar */
        .profile-navbar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .profile-navbar a {
            color: white;
            text-decoration: none;
            font-size: 22px;
        }

        .profile-navbar a:hover {
            color: #ccc;
        }

        /* Gallery Section */
        .gallery-title {
            text-align: center;
            font-size: 56px;
            font-weight: normal;
            color: #333;
            margin: 0 0 12px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 28px;
            max-width: 1650px;
            margin: 0 auto;
            padding: 0 20px 30px;
        }

        .gallery-item {
            background-color: white;
            padding: 14px;
            border-radius: 12px;
            overflow: hidden;
        }

        .gallery-item img {
            display: block;
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 10px;
            transition: transform 0.3s ease;
        }

        .gallery-item img:hover {
            transform: scale(1.03);
        }

        /* Tablet */
        @media (max-width: 992px) {
            .gallery {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 18px;
            }

            .gallery-title {
                font-size: 44px;
            }

            .gallery-item img {
                height: 240px;
            }
        }

        /* Mobile */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .profile-header {
                padding: 20px 10px 25px;
            }

            .profile-img {
                width: 200px;
                height: 220px;
            }

            .profile-header h1 {
                font-size: 25px;
            }

            .profile-navbar {
                gap: 15px;
            }

            .profile-navbar a {
                font-size: 16px;
            }

            .gallery-title {
                font-size: 35px;
                margin-bottom: 15px;
            }

            .gallery {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
                padding: 0 0 20px;
            }

            .gallery-item {
                padding: 7px;
                border-radius: 9px;
            }

            .gallery-item img {
                height: 180px;
                border-radius: 7px;
            }
        }
    </style>
</head>
