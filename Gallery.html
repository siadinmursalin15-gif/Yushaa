    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px 20px;
            background-color: #f1f1f1;
            font-family: Arial, sans-serif;
        }

        /* Header */
        .header {
            background-color: black;
            color: white;
            text-align: center;
            padding: 25px 15px 35px;
        }

        .header img {
            width: 290px;
            height: 290px;
            object-fit: cover;
        }

        .header h1 {
            font-size: 36px;
            font-weight: normal;
            margin: 15px 0 20px;
        }

        /* Navigation */
        .navbar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 25px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-size: 22px;
        }

        .navbar a:hover {
            color: #ccc;
        }

        /* Gallery */
        .gallery-title {
            text-align: center;
            font-size: 56px;
            font-weight: normal;
            color: #333;
            margin: 0 0 15px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 28px;
            max-width: 1650px;
            margin: auto;
            padding: 0 20px 30px;
        }

        .gallery img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            padding: 12px;
            background: white;
            border-radius: 12px;
            transition: transform 0.3s;
        }

        .gallery img:hover {
            transform: scale(1.03);
        }

        /* Tablet */
        @media (max-width: 992px) {
            .gallery {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 18px;
            }
        }

        /* Mobile */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .header img {
                width: 200px;
                height: 220px;
            }

            .header h1 {
                font-size: 25px;
            }

            .navbar {
                gap: 15px;
            }

            .navbar a {
                font-size: 16px;
            }

            .gallery-title {
                font-size: 35px;
            }

            .gallery {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
                padding: 0 0 20px;
            }

            .gallery img {
                height: 180px;
                padding: 7px;
            }
        }
    </style>
