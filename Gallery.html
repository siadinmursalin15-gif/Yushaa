    <style>
        body {
            margin: 0;
            background-color: #000;
            color: white;
        }

        .gallery-container {
            padding: 35px 15px;
        }

        .gallery-title {
            text-align: center;
            margin-bottom: 35px;
            font-size: 36px;
            font-weight: bold;
            color: white;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 18px;
        }

        .gallery-grid img {
            width: 100%;
            height: 270px;
            object-fit: cover;
            border-radius: 10px;
            transition: transform 0.3s ease;
        }

        .gallery-grid img:hover {
            transform: scale(1.03);
        }

        @media (max-width: 992px) {
            .gallery-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        @media (max-width: 600px) {
            .gallery-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
            }

            .gallery-grid img {
                height: 180px;
            }

            .gallery-title {
                font-size: 28px;
            }
        }
    </style>
</head>
