<!-- ================= CAROUSEL ================= -->
<section id="slider"
         class="carousel slide"
         data-bs-ride="carousel"
         data-bs-interval="3000">

    <!-- Slide Indicators -->
    <div class="carousel-indicators">
        <button type="button" data-bs-target="#slider"
                data-bs-slide-to="0" class="active"
                aria-current="true" aria-label="Slide 1"></button>

        <button type="button" data-bs-target="#slider"
                data-bs-slide-to="1"
                aria-label="Slide 2"></button>

        <button type="button" data-bs-target="#slider"
                data-bs-slide-to="2"
                aria-label="Slide 3"></button>
    </div>

    <div class="carousel-inner">

        <!-- Slide 1 -->
        <div class="carousel-item active">
            <img src="./27.jpeg"
                 class="d-block w-100 slider-image"
                 alt="Gallery preview">

            <div class="carousel-caption">
                <p>Wanna see me?</p>
                <a href="./Gallery.html" class="btn btn-light">
                    Learn more
                </a>
            </div>
        </div>

        <!-- Slide 2 -->
        <div class="carousel-item">
            <img src="./18.jpeg"
                 class="d-block w-100 slider-image"
                 alt="About me preview">

            <div class="carousel-caption">
                <p>Wanna know about me?</p>
                <a href="./Aboutme.html" class="btn btn-light">
                    Learn more
                </a>
            </div>
        </div>

        <!-- Slide 3 -->
        <div class="carousel-item">
            <img src="./contact.jfif"
                 class="d-block w-100 slider-image"
                 alt="Contact preview">

            <div class="carousel-caption">
                <p>Wanna contact?</p>
                <a href="./Contact.html" class="btn btn-light">
                    Learn more
                </a>
            </div>
        </div>

    </div>

    <!-- Previous Button -->
    <button class="carousel-control-prev"
            type="button"
            data-bs-target="#slider"
            data-bs-slide="prev"
            aria-label="Previous slide">
        <span class="carousel-control-prev-icon"></span>
    </button>

    <!-- Next Button -->
    <button class="carousel-control-next"
            type="button"
            data-bs-target="#slider"
            data-bs-slide="next"
            aria-label="Next slide">
        <span class="carousel-control-next-icon"></span>
    </button>

</section>
